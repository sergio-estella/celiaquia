<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La celiaquía es una enfermedad, no un capricho</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Columna editorial estrecha. Un solo color de énfasis (#26C9C0) para sobrecoste, sobreprecio y cobertura. Fondo y texto fijados por el usuario; los grises salen del color de texto con transparencia. */
:root{
  --bg:#E5FAFF;
  --ink:#0B193B;
  --ink-soft:rgba(11,25,59,.80);
  --muted:rgba(11,25,59,.62);
  --rule:rgba(11,25,59,.45);
  --hair:rgba(11,25,59,.15);
  --grid:rgba(11,25,59,.09);
  --ref:rgba(11,25,59,.26);
  --track:rgba(11,25,59,.11);
  --cost:#26C9C0;
  --cost-ink:#0A6B66;
  --cost-wash:rgba(38,201,192,.14);
  --cover:#26C9C0;
  --zero:#26C9C0;
  --tip-bg:#0B193B; --tip-ink:#E5FAFF;
  --font:"Inter", Arial, sans-serif;
  color-scheme:light;
}

[data-theme="dark"]{
  --bg:#0B193B; --ink:#E5FAFF; --ink-soft:rgba(229,250,255,.82); --muted:rgba(229,250,255,.62); --rule:rgba(229,250,255,.42);
  --hair:rgba(229,250,255,.16); --grid:rgba(229,250,255,.09); --ref:rgba(229,250,255,.32); --track:rgba(229,250,255,.13);
  --cost:#26C9C0; --cost-ink:#26C9C0; --cost-wash:rgba(38,201,192,.16); --cover:#26C9C0; --zero:#26C9C0; --tip-bg:#E5FAFF; --tip-ink:#0B193B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body,button,input,select,textarea,summary,table,svg,svg text{font-family:var(--font)}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:calc(1360px + 2*var(--gut));margin:0 auto;padding:56px var(--gut) 72px}
:root{--gut:clamp(16px,4vw,48px)}
.kicker{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
h1{font-weight:700;font-size:clamp(36px,6vw,60px);line-height:1;margin:22px 0 0;letter-spacing:-.03em;text-wrap:balance;max-width:20ch}
h2{font-weight:700;font-size:clamp(23px,3.2vw,30px);line-height:1.12;margin:0;letter-spacing:-.02em;text-wrap:balance}
.lede{max-width:68ch;margin:18px 0 0;font-size:15.5px;line-height:1.55}
.lede b{font-weight:700}
.hero{margin-top:22px}
.big{font-weight:800;font-size:clamp(84px,14vw,150px);line-height:.82;letter-spacing:-.05em;white-space:nowrap}
.big small{font-size:.28em;letter-spacing:-.01em;margin-left:.08em;font-weight:700}
.big-cap{margin:16px 0 0;font-size:15px}
.big-cap b{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 40px;margin-top:36px;padding:26px 0 24px;border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule)}
.stat{display:grid;gap:3px;align-content:start;font-size:13.5px;line-height:1.4}
.stat > b{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.stat span b{font-weight:700}
.stat .zero{color:var(--cost-ink);margin-top:12px}
section.viz{padding:44px 0 6px;border-bottom:1.5px solid var(--rule)}
.dek{max-width:72ch;margin:10px 0 0;font-size:14.5px;line-height:1.5;color:var(--ink-soft)}
.dek.small{font-size:13.5px;color:var(--ink);margin-top:12px}
.dek.small b{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 26px;margin:22px 0 8px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.dot.hollow{border:1.8px solid var(--cost);background:var(--bg)}
.chart{position:relative;width:100%;margin-top:10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--font)}
.tick{font-size:11.5px;fill:var(--ink);font-variant-numeric:tabular-nums}
.focusable{cursor:pointer}
.focusable:focus{outline:none}
.focusable:focus-visible .ring-focus{stroke:var(--ink);stroke-width:2}

/* tooltip */
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--tip-bg);color:var(--tip-ink);border-radius:8px;padding:9px 12px;font-size:13px;line-height:1.4;max-width:270px;opacity:0;transition:opacity .12s}
.tip strong{display:block;font-size:16px;font-weight:700}
.tip .m{opacity:.78;font-size:12px;margin-top:3px}
@media (prefers-reduced-motion:reduce){.tip{transition:none}}

/* anotaciones numeradas */
.ann{list-style:none;margin:18px 0 0;padding:16px 0 0;border-top:1px solid var(--hair);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 22px;font-size:12.5px;line-height:1.45}
.ann li{display:grid;grid-template-columns:20px 1fr;gap:6px;align-items:start}
.ann .n{width:16px;height:16px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:9.5px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.ann b{font-weight:700}

/* círculos de euros */
.units{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 44px;position:relative}
.unit{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:start;cursor:pointer;border-radius:6px}
.unit:focus{outline:none}
.unit:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.uname{font-size:14px;line-height:1.3}
.umult{font-size:14px;font-weight:700;text-align:right;line-height:1.05;font-variant-numeric:tabular-nums}
.umult i{display:block;font-style:normal;font-size:12px;font-weight:700}
.unit svg{grid-column:1/-1;display:block;height:24px;width:auto;overflow:visible}

/* anillos */
.rings{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:30px 14px;position:relative}
.ringcell{display:grid;justify-items:center;align-content:start;gap:8px;text-align:center;cursor:pointer;border-radius:8px;padding:4px}
.ringcell:focus{outline:none}
.ringcell:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ringcell svg{width:96px;height:96px;display:block}
.rname{font-size:13px;line-height:1.3;min-height:2.6em;display:flex;align-items:flex-start;justify-content:center}
.rmeta{font-size:12px;line-height:1.3;color:var(--ink-soft)}
.note{font-size:12.5px;line-height:1.6;max-width:80ch;margin:28px 0 0;color:var(--ink-soft)}
.note + .note{margin-top:10px}


/* interruptores */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.switch{display:inline-flex;border:0;background:color-mix(in srgb,var(--ink) 20%,transparent);border-radius:999px;padding:3px;gap:2px;margin:0;flex:none}
.vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.vhead .switch{margin-top:2px}
.switch.theme{margin:0}
.switch button{color:var(--ink);background:transparent;border:0;border-radius:999px;width:34px;height:28px;padding:0;display:grid;place-items:center;cursor:pointer}
.switch button svg{display:block}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.switch button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
section.viz[data-view="table"] .view-chart{display:none}
section.viz[data-view="chart"] .view-table{display:none}
.view-table .tbl{margin-top:6px}

/* siluetas */
.ringcell svg.shape{width:96px;height:96px;display:block}
.pct{font-size:12px;color:var(--ink-soft);line-height:1}
.pct b{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.01em;margin-right:3px}

/* cita y cifras */
.quote{margin:34px 0 0;padding:0 0 0 18px;border-left:3px solid var(--cost);font-size:clamp(17px,2.2vw,21px);line-height:1.4;font-weight:500;max-width:46ch;text-wrap:balance}
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 40px;margin-top:28px}
.mcol{display:grid;gap:4px;align-content:start;font-size:13.5px;line-height:1.45}
.mlab{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700}
.mcol b{font-size:clamp(34px,5vw,48px);font-weight:800;letter-spacing:-.03em;line-height:1}
.mcol b.accent{color:var(--cost-ink)}
.mbar{margin-top:18px;height:14px;border-radius:3px;background:var(--track);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--cost);border-radius:3px 0 0 3px;min-width:2px}
@media (max-width:560px){.money{grid-template-columns:1fr}}

.sw.hatch{display:inline-block;width:12px;height:12px;border-radius:2px;background:repeating-linear-gradient(45deg,transparent 0 3px,var(--cost) 3px 4px);box-shadow:inset 0 0 0 1px var(--cost)}
.milestones{list-style:none;margin:10px 0 0;padding:0;display:none;gap:6px 18px;font-size:12.5px;line-height:1.4;grid-template-columns:1fr 1fr}
.milestones b{font-weight:700;display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
@media (max-width:1040px){.milestones{display:grid}}
@media (min-width:700px) and (max-width:1040px){.milestones{grid-template-columns:repeat(4,1fr)}}
.t-place{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;fill:var(--ink)}
.t-date{font-size:11px;fill:var(--ink-soft)}
.t-lab{font-size:12px;font-weight:700;fill:var(--ink)}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.t-band{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700}

.share{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:16px 0 4px}
.share-lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;margin-right:4px}
.pill{display:inline-flex;align-items:center;gap:7px;font:600 13px/1 var(--font);color:var(--ink);background:color-mix(in srgb,var(--ink) 20%,transparent);border:0;border-radius:999px;padding:8px 14px 8px 11px;cursor:pointer}
.pill:hover{background:color-mix(in srgb,var(--ink) 30%,transparent)}
.pill:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pill[disabled]{opacity:.55;cursor:progress}
.share-msg{font-size:13px;color:var(--ink-soft)}
.solo-back{display:none;margin:22px 0 0;font-size:14px}
.solo-back a{color:var(--ink);font-weight:600}
body.solo .wrap>*:not(#trigo){display:none}
body.solo #trigo{border-bottom:0;padding-top:8px}
body.solo .solo-back{display:block}
.t-note{font-size:13px;fill:var(--ink-soft)}
.t-yr{font-size:12.5px;font-weight:700;fill:var(--cost-ink)}
.t-yr-g{font-size:12.5px;font-weight:700;fill:var(--ink)}
.t-gap{font-size:19px;font-weight:800;letter-spacing:-.02em;fill:var(--ink)}
.t-gap-s{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;fill:var(--ink)}
.t-cart-h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;fill:var(--ink)}
.t-cart-big{font-size:30px;font-weight:800;letter-spacing:-.03em;fill:var(--ink)}
.t-th-h{font-size:18px;font-weight:800;letter-spacing:-.02em;fill:var(--ink)}
.t-th-idx{font-size:13px;font-weight:700;fill:var(--ink)}
.t-lab-big{font-size:15px;font-weight:800;fill:var(--ink)}

/* logo, salto y foco */
.brand{display:inline-flex;align-items:center;gap:10px}
.brand svg{flex:none;color:var(--ink)}
.skip{position:absolute;left:var(--gut);top:-60px;z-index:10;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:6px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}
a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px}
.yr:focus-visible{outline:none}
.yr:focus-visible + .yr-ring, .yr.on{stroke:var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
/* retícula: textos con ancho de lectura, gráficos a todo el ancho */
.lede,.dek{max-width:72ch}
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:1100px){.rings{grid-template-columns:repeat(7,minmax(0,1fr))}.units{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:761px) and (max-width:1099px){.rings{grid-template-columns:repeat(5,minmax(0,1fr))}}

/* pie y fuentes */
details{margin:20px 0 22px;font-size:13.5px}
summary{cursor:pointer;font-weight:600}
summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
.tbl{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-weight:600}
td.num{text-align:right;white-space:nowrap}
footer{font-size:12.5px;line-height:1.55;display:grid;gap:10px;max-width:80ch;margin-top:30px;color:var(--ink-soft)}
footer strong{color:var(--ink)}
a.ref{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sources{padding:26px 0 0;margin-top:26px;border-top:1px solid var(--hair)}
.sources h2{font-size:20px}
.srcgroup{margin-top:16px}
.srcgroup h3{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;margin:0 0 8px;font-weight:700}
.srcgroup ol{margin:0;padding-left:0;list-style:none;display:grid;gap:7px;font-size:12.5px;line-height:1.45}
.srcgroup li{display:grid;grid-template-columns:32px 1fr;gap:6px}
.srcgroup li:target{background:var(--grid);border-radius:4px}
.srcn{font-weight:700;font-variant-numeric:tabular-nums}
.srctag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--hair);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.srcgroup a{color:var(--ink);word-break:break-word}

@media (max-width:760px){
  .wrap{padding:32px 16px 48px}
  .stats{grid-template-columns:1fr;gap:18px}
  .ann{grid-template-columns:1fr 1fr}
  .units{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 22px}
  .rings{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 8px}
  .ringcell svg,.ringcell svg.shape{width:84px;height:84px}
}
@media (max-width:460px){
  .ann{grid-template-columns:1fr}
  .units{gap:20px 14px}
  .uname{font-size:13px}
}
@media (max-width:340px){
  .units{grid-template-columns:1fr}
}

/* ================= Retícula suiza (Neue Grafik) ================= */
:root{--cg:clamp(16px,2.2vw,32px)}
.wrap{padding-top:clamp(28px,4vw,56px)}
.lab{font-size:12.5px;line-height:1.35;font-weight:500;margin:0;color:var(--ink)}
/* Interruptores sin fondo, iconos de línea */
.switch{background:transparent;padding:0;gap:4px;border-radius:0}
.switch button{width:30px;height:30px;border-radius:0;color:var(--ink);opacity:.38;position:relative;transition:opacity .15s}
.switch button:hover{opacity:.75}
.switch button[aria-pressed="true"]{background:transparent;color:var(--ink);opacity:1}
.switch button[aria-pressed="true"]::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:1.5px;background:currentColor}
.pill{background:transparent;padding:6px 0;border-radius:0;gap:7px;font-weight:500;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.pill:hover{background:transparent;text-decoration-color:var(--ink)}
.share{gap:6px 22px}
/* Tipografía */
h1{font-size:clamp(44px,8.6vw,132px);line-height:.92;letter-spacing:-.045em;max-width:none;margin-top:clamp(36px,6vw,90px);font-weight:700}
h2{font-size:clamp(28px,4.2vw,58px);line-height:.98;letter-spacing:-.04em;font-weight:700}
.big{font-size:clamp(110px,22vw,320px);letter-spacing:-.06em;line-height:.8}
.kicker{font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:500}
.dek{font-size:15px;line-height:1.45}
.note,footer{font-size:12.5px;line-height:1.5}
@media (min-width:900px){
  .g4,.intro,.hero,.stats,section.viz,footer,.sources{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:var(--cg)}
  .topbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:var(--cg)}
  .topbar .brand{grid-column:1/4}
  .topbar .switch.theme{grid-column:4;justify-self:end}
  .intro{margin-top:clamp(28px,3.5vw,48px);align-items:start}
  .intro .lab{grid-column:1}
  .intro .lede{margin:0;max-width:none;font-size:15px;line-height:1.45}
  .intro .lede-b{grid-column:2;font-weight:700}
  .intro .lede:not(.lede-b){grid-column:3/5;max-width:46ch}
  .hero{margin-top:clamp(70px,9vw,140px);align-items:end}
  .hero .lab{grid-column:1/-1;margin-bottom:14px}
  .hero .big{grid-column:1/4}
  .hero .big-cap{grid-column:4;margin:0 0 .4em;font-size:15px;line-height:1.45}
  .stats{margin-top:clamp(56px,7vw,100px);padding:0;border:0;row-gap:0}
  .stats .lab{grid-column:1}
  section.viz{padding:clamp(90px,10vw,150px) 0 0;border:0;align-items:start}
  section.viz > .snum{grid-column:1;grid-row:1/span 3}
  section.viz > .vhead,section.viz > .dek,section.viz > p,section.viz > .legend{grid-column:2/-1}
  section.viz > .dek{max-width:none;grid-column:2/4}
  section.viz > .view-chart,section.viz > .view-table{grid-column:1/-1}
  .view-chart > .legend,.view-chart > .note,.view-chart > .share,.view-chart > .solo-back,.view-chart > .milestones{margin-left:calc((100% + var(--cg))/4)}
  .view-chart > .note{max-width:calc((100% + var(--cg))/2 - var(--cg))}
  footer{max-width:none;margin-top:clamp(90px,10vw,150px);row-gap:12px}
  footer .lab{grid-column:1;grid-row:1/span 2}
  footer > div{grid-column:2/4}
  .sources{border:0;margin-top:clamp(60px,7vw,100px);padding:0}
  .sources .lab{grid-column:1}
  .sources #srcList{grid-column:2/-1}
  .vhead{display:flex}
}
@media (max-width:899px){
  .lab{margin:0 0 10px}
  .intro{margin-top:24px}
  .intro .lede{margin:0 0 10px}
  .hero{margin-top:48px}
  .stats{border:0;padding:0;margin-top:48px}
  section.viz{border:0;padding-top:80px}
  footer{margin-top:80px}
  .sources{border:0}
  .snum{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
}
.snum b{display:block;font-size:clamp(56px,7vw,110px);font-weight:700;line-height:.8;letter-spacing:-.05em}
.snum span{display:block;font-size:12.5px;line-height:1.35;font-weight:500;margin-top:18px;max-width:22ch}
@media (max-width:899px){.snum span{margin-top:0}}
.stat > b{font-size:clamp(30px,3.4vw,48px);letter-spacing:-.04em;line-height:.95;font-weight:700;margin-bottom:6px}
.stat{font-size:13.5px}
.ann{border-top:0;padding-top:0;margin-top:26px}
.vhead h2{max-width:22ch}
body.solo section.viz{padding-top:24px}
.ann{column-gap:var(--cg)}
.vhead + .dek,.vhead ~ .dek{margin-top:14px}

/* ===== Ajustes de noviembre: entradillas, tres vistas, barras, tarta, monedas ===== */
section.viz[data-view="bars"] .view-chart,section.viz[data-view="bars"] .view-table{display:none}
section.viz:not([data-view="bars"]) .view-bars{display:none}
.dek{max-width:78ch}
.view-chart > .legend,.view-bars > .bhead{margin-top:30px;margin-bottom:22px}
@media (min-width:900px){
  section.viz > .dek{grid-column:2/-1;max-width:78ch}
  section.viz > .view-bars{grid-column:2/-1}
  section.viz > .quote,section.viz > .money,section.viz > .note{grid-column:2/-1}
  .money{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:var(--cg)}
}
/* Barras de ayuda */
.bhead{display:grid;grid-template-columns:minmax(120px,190px) 1fr 110px;gap:16px;font-size:12px;color:var(--ink-soft)}
.bhead span:last-child{grid-column:2/-1}
.bars{display:grid;gap:2px}
.brow{display:grid;grid-template-columns:minmax(120px,190px) 1fr 110px;gap:16px;align-items:center;padding:7px 0;border-bottom:1px solid var(--hair)}
.bname{font-size:14px;font-weight:500}
.btrack{height:14px;background:var(--track);position:relative}
.btrack i{position:absolute;left:0;top:0;bottom:0;background:var(--cover)}
.bval{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bval b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.bval span{font-size:12px;color:var(--ink-soft)}
.brow:not(.zero) .bval b{color:var(--cost-ink)}
.brow.zero .bname{color:var(--ink-soft)}
@media (max-width:560px){.bhead,.brow{grid-template-columns:1fr auto;gap:4px 12px}.btrack{grid-column:1/-1;grid-row:2}.bhead span:last-child{grid-column:1/-1}}
/* Tarta del dinero */
.mpie #mPie{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;margin-top:6px}
.mpie svg{grid-row:1/span 2;width:120px;height:120px}
.mpie #mPie b{font-size:clamp(34px,5vw,48px);font-weight:800;letter-spacing:-.03em;line-height:1;align-self:end}
.mpie #mPie b.accent{color:var(--cost-ink)}
.mpie #mPie span{font-size:13.5px;line-height:1.45;align-self:start}
@media (max-width:899px){.money{grid-template-columns:1fr}}
/* Monedas de productos: una fila por producto */
.units{display:grid;grid-template-columns:1fr;gap:0;margin-top:0}
@media (min-width:1100px){.units{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:var(--cg)}}
.urow{display:grid;grid-template-columns:minmax(130px,1fr) auto 64px;grid-template-areas:"n c v" "n p p";gap:2px 16px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair)}
.uname{grid-area:n;font-size:14px;font-weight:500;line-height:1.3}
.coins{grid-area:c;display:block;height:18px;width:auto;max-width:100%}
.uval{grid-area:v;font-size:16px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.uprice{grid-area:p;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
@media (max-width:560px){.urow{grid-template-columns:1fr auto;grid-template-areas:"n v" "c c" "p p";gap:6px 12px}}
.coin{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);box-sizing:border-box}
.coin.on{background:var(--cover);border-color:var(--cover)}
.coin.part{border-color:var(--cover);background:linear-gradient(90deg,var(--cover) 50%,transparent 50%)}

.urow{grid-template-columns:1fr auto;grid-template-areas:"n v" "c c" "p p";gap:6px 12px;padding:12px 0}
.urow .coins{justify-self:start}
@media (min-width:1100px){.units{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hl{color:var(--cost-ink)} #t0{max-width:34ch}

.bdesc{grid-column:1/-1;font-size:12px;line-height:1.4;color:var(--ink-soft);margin-top:-2px}
/* Anchos de texto unificados: columnas 2 a 4 */
@media (min-width:900px){
  section.viz > .dek,section.viz > .note,section.viz > p,section.viz > .quote,section.viz > .money{grid-column:2/-1;max-width:none}
  .view-chart > .note,.view-bars > .note,.view-chart > .milestones{max-width:none}
  .view-bars > .note{margin-left:0}
  footer > div{grid-column:2/-1;max-width:none}
  .intro .lede:not(.lede-b){max-width:none}
  .quote{max-width:none}
}
.dek,.note,footer p{max-width:none}

body{margin:0}
a{color:var(--ink)}a:hover{color:var(--ink-soft)}

/* Leyenda y compartir en la misma fila */
.view-chart > .lbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 32px;margin:30px 0 22px}
.lbar > .legend{margin:0}
.lbar > .share{margin:0;gap:4px 18px;font-size:12.5px}
.lbar .share-lbl{margin-right:0}
.lbar .pill{font-size:12.5px;padding:4px 0;gap:6px}
.lbar .share-msg{font-size:12.5px}
.lbar .share-msg:empty{display:none}

#trigo .view-chart > .lbar{margin-left:0}
#evo .view-chart > .legend{margin-left:0}
html,body{background:var(--bg)}
.page{min-height:100vh}

/* Lectura al pasar el ratón */
.tip{position:fixed;opacity:0;max-width:300px}
.tip.on{opacity:1}
.tip .d{margin-top:4px;font-size:12px;opacity:.85}
.chart [tabindex]{cursor:crosshair}
.focusable:hover .ring-focus{stroke:var(--ink);stroke-width:2}
.scrub{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;opacity:.6;pointer-events:none}
.ringcell,.urow,.brow{transition:opacity .15s}
.rings:hover .ringcell:not(:hover),.units:hover .urow:not(:hover),.bars:hover .brow:not(:hover){opacity:.45}
.urow,.brow{cursor:default}
.milestones li.cel b{color:var(--cost-ink)}
#tbl0 b.cel{color:var(--cost-ink)}
#tbl0 td:nth-child(2){min-width:280px}
#tbl0 td:first-child{white-space:nowrap}
/* Notas de la gráfica 1, bajo el gráfico */
.chart-notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px var(--cg);margin-top:22px}
.chart-notes .cn{align-content:start;border-top:1px solid var(--hair);padding-top:10px;display:grid;gap:3px;font-size:13.5px;line-height:1.45;color:var(--ink-soft)}
.chart-notes .cn b{font-size:13px;font-weight:700;color:var(--ink)}
.chart-notes .cn.cost b{color:var(--cost-ink)}
@media (max-width:760px){.chart-notes{grid-template-columns:1fr}}
@media (min-width:900px){#trigo .view-chart > .chart-notes{margin-left:calc((100% + var(--cg))/4)}}
.swipe{display:none;font-size:12.5px;color:var(--ink-soft);margin:0 0 6px}
@media (max-width:760px){.swipe{display:block}#c0{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}#c0 svg{width:900px;max-width:none}}
/* Módulo 1: más aire y anotaciones numeradas */
#trigo .view-chart > .lbar{margin:44px 0 40px}
#trigo .chart{margin-top:0}
#trigo .ann{margin-top:44px;row-gap:20px;font-size:13px}
#trigo .view-chart > .note{margin-top:44px}
#trigo .view-chart > .share{margin-top:0}
.ann .n.cel{background:var(--cost-ink)}
/* Idioma junto al tema */
.tools{display:flex;align-items:center;gap:12px}
.tools-sep{width:1px;height:18px;background:var(--ink);opacity:.35}
.switch.lang button{width:auto;min-width:30px;padding:0 4px;font:600 12.5px/1 var(--font);letter-spacing:.04em}
@media (min-width:900px){.topbar .tools{grid-column:4;justify-self:end}}

    <ol class="ann" id="annTrigo"><li><span class="n">1</span><span><b>c. 9500–8500 a. C. · Creciente Fértil. </b>Se domestican los primeros trigos (escaña y escanda) en el sureste de la actual Turquía.</span></li><li><span class="n">2</span><span><b>III milenio a. C. · Egipto · Mesopotamia. </b>El pan, leudado y cocido en horno, se convierte en el alimento básico.</span></li><li><span class="n">3</span><span><b>123 a. C.–s. III · Roma. </b>La annona: el Estado reparte trigo subvencionado, y después gratuito, en la ciudad de Roma.</span></li><li><span class="n cel">4</span><span><b>s. II d. C. · Areteo de Capadocia. </b>Describe la «koiliakos»: el primer relato conocido de la enfermedad celíaca.</span></li><li><span class="n">5</span><span><b>s. XI–XIII · Europa feudal. </b>Los señores obligan a moler y cocer en sus molinos y hornos, previo pago.</span></li><li><span class="n">6</span><span><b>1870–1880 · Grandes Llanuras. </b>El trigo duro de invierno y los molinos de rodillos generalizan la harina blanca industrial.</span></li><li><span class="n cel">7</span><span><b>1888 · Samuel Gee. </b>Publica «On the coeliac affection», la primera descripción clínica moderna.</span></li><li><span class="n cel">8</span><span><b>1950 · Willem Dicke. </b>Demuestra que el trigo causa la enfermedad: los niños celíacos mejoraron en la hambruna holandesa de 1944, cuando faltó el pan.</span></li><li><span class="n">9</span><span><b>1960 · Revolución Verde. </b>Las variedades semienanas de Borlaug multiplican el rendimiento en México, India y Pakistán.</span></li><li><span class="n">10</span><span><b>1980–2022 · Trigo. </b>La producción mundial de trigo crece un 83 %, de 443 a 808 millones de toneladas.</span></li><li><span class="n cel">11</span><span><b>1994 · Nace FACE. </b>Se constituye la Federación de Asociaciones de Celíacos de España.</span></li><li><span class="n cel">12</span><span><b>2007 · Primer dato de FACE. </b>FACE calcula 1.758 € al año de sobrecoste por persona. Hasta 2015 no baja de 1.450 €.</span></li><li><span class="n cel">13</span><span><b>2009 · Límite de 20 mg/kg. </b>La UE fija el máximo de gluten para etiquetar un alimento «sin gluten» (Reglamento CE 41/2009).</span></li><li><span class="n cel">14</span><span><b>2026 · Hoy. </b>996,37 € al año. La brecha es menor que en 2007, pero la cesta sin gluten cuesta 2,4 veces la misma con gluten; el pan de barra, 5,2 veces.</span></li></ol>
    <p class="note">Desde 1980, el grosor de la banda es la producción mundial de trigo <a class="ref" href="#src-WHEAT">[34]</a> <a class="ref" href="#src-FAO93">[35]</a>; antes de 1980 la banda y los hitos son figurativos y no están a escala. La altura del hilo sobre la banda es el sobrecoste de FACE <a class="ref" href="#src-F07">[20]</a> <a class="ref" href="#src-F26">[1]</a>, con la misma escala en euros en todo el hilo; entre 1980 y 2007 no hay serie y el tramo discontinuo solo une el punto de partida con el primer dato. Los años sin dato de producción (1981–1988, 1990 y 1993–1995) se interpolan y desde 2023 la banda mantiene el último valor publicado (2022). Límite legal de «sin gluten»: <a class="ref" href="#src-UE828">[39]</a>.</p>

    <p class="dek">Desde 2007 hasta 2023, el sobrecoste de los alimentos SIN GLUTEN tendió a bajar, pero diferentes eventos han ido perjudicando esta evolución. Injusta, de cualquier manera, para los celíacos, que en 15 de los 19 territorios no reciben ninguna ayuda económica.</p>

    <div class="snum" aria-hidden="true"><b>3</b><span>Ayudas por territorio<br>Fuentes: Boletines oficiales, AEAT, INE</span></div>
    <div class="vhead">
      <h2 id="t3">La deducción estatal de 600 € sigue sin aprobarse. 15 territorios reciben 0 euros de ayuda. 4 reciben ayudas parciales.</h2>

    <p class="dek">Cada silueta o barra representa los 996 € que pagan de más las personas que padecen celiaquía. En color se representa la ayuda que reciben en su territorio. El resto de ese dinero lo paga cada familia con un celiaco.</p>

    <p class="note">Base: 996,37 €/persona/año <a class="ref" href="#src-F26">[1]</a>. Se supone acceso íntegro a la ayuda o deducción; Asturias: hasta 100 € y sujeto a renta.<br>«Sin ayuda incluida» se refiere a ayuda monetaria vigente del gobierno de cada territorio; Cataluña la tiene aprobada para finales de 2026, todavía no disponible.<br>No incluye ayudas municipales, lotes de alimentos ni MUFACE. Los territorios tienen el mismo peso visual.<br>Castilla-La Mancha: ayuda directa. La Rioja, Andalucía y Asturias: deducciones fiscales.</p>
    <blockquote class="quote">FACE estima que en España hay entre 450.000 y 500.000 personas celíacas y que unas 3 de cada 4 no lo saben. <a class="ref" href="#src-DEB">[37]</a> <a class="ref" href="#src-CON25">[38]</a> Los registros de atención primaria apuntan en la misma dirección: en Aragón solo consta diagnosticado el 0,35 % de la población, frente al 1 % esperado. <a class="ref" href="#src-ARA">[43]</a></blockquote>
    <div class="money" aria-label="Cuánto haría falta y cuánto se da">
      <div class="mcol"><span class="mlab">Lo que haría falta al año</span><b id="mNeed">124,5 M€</b><span id="mNeedTxt">para compensar el sobrecoste completo a unas 125.000 personas diagnosticadas (1 de cada 4). Si lo estuvieran las 500.000, serían 498,2 M€.</span></div>
      <div class="mcol"><span class="mlab">Ayuda que dan, como máximo, los territorios</span><b id="mGiven" class="">5,4 M€</b><span id="mGivenTxt">si todas las personas diagnosticadas de Castilla-La Mancha, La Rioja, Andalucía y Asturias cobraran la ayuda completa: el 4,3% de lo que haría falta.</span></div>
      <div class="mcol mpie"><span class="mlab">Parte cubierta de lo que haría falta</span><div id="mPie"><svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="Gráfico circular: los territorios cubren el 4,3 % de lo que haría falta."><circle cx="75" cy="75" r="73" fill="var(--track)"></circle><path d="M75,75 L75,2 A73,73 0 0 1 94.55008647732228,4.666550498861355 Z" fill="var(--cover)"></path><circle cx="75" cy="75" r="73" fill="none" stroke="var(--rule)" stroke-width="1"></circle></svg><b class="">4,3 %</b><span>cubierto. El 95,7 % restante lo pagan las familias.</span></div></div>
    </div>
    <p class="note" id="moneyNote">Cálculo propio. Personas diagnosticadas repartidas según la población de cada territorio (padrón INE 2025) <a class="ref" href="#src-INE">[41]</a>; ayuda por persona según cada territorio; sobrecoste de 996,37 € <a class="ref" href="#src-F26">[1]</a>. Es un máximo teórico: Castilla-La Mancha limita la ayuda a 1.000 € por familia y Asturias, a rentas por debajo de 35.000&nbsp;€. Para comparar, la proposición de ley estatal calcula un coste de unos 60 M€ al año con los diagnósticos actuales <a class="ref" href="#src-BOCG">[23]</a>. La proporción de personas diagnosticadas es una estimación: si fuera distinta, el cálculo cambia en proporción (con 1 de cada 3 diagnosticada, harían falta unos 166 M€).</p>
    <p class="note" id="aggNote">Si se pondera por población (padrón INE 2025), estos cuatro territorios suman el 25% de los habitantes de España, y sus ayudas cubrirían como máximo el 4,3% del sobrecoste del conjunto del país. Es un techo teórico, no lo efectivamente cobrado. <a class="ref" href="#src-INE">[41]</a></p>

    <p class="lab">Método</p>
    <div><strong>Cómo se mide.</strong> FACE compara cada año 21 productos específicos sin gluten (pan, pasta, harinas, galletas…) con su versión con gluten en hipermercados de ámbito nacional y estima el gasto anual de un adulto. La fruta, la verdura o la carne no cuentan: no llevan gluten. Hasta 2015 el cálculo se basaba en una dieta de 2.000 a 2.300 kcal; desde 2016, de 2.000 a 2.200 kcal, y el número de cadenas y el mes de recogida de precios también han variado. Por eso las cifras se comparan mejor como tendencia que año a año.</div>
    <div><strong>Cómo se citan las fuentes.</strong> Siempre que existe, se enlaza el documento original (informe o nota de FACE, BOE, Agencia Tributaria, INE, Junta). Cuando no se ha localizado el original, se enlaza la noticia que cita la cifra exacta de FACE y el punto aparece hueco en el gráfico. Fuentes consultadas entre octubre y noviembre de 2026.</div>
  </footer><section class="sources" id="fuentes" aria-labelledby="tS">

    <h1>Coeliac disease is an illness, not a whim.</h1>
    <div class="intro">
      <p class="lab">A data story<br>Spain, 2007–2026</p>
      <p class="lede lede-b">A gluten-free diet is not a choice: it is the only treatment.</p>
      <p class="lede">A person with coeliac disease spends more on groceries every year, according to the annual reports of the Federation of Coeliac Associations of Spain (FACE).</p>

    <ol class="ann" id="annTrigo"><li><span class="n">1</span><span><b>c. 9500–8500 BC · Fertile Crescent. </b>The first wheats (einkorn and emmer) are domesticated in what is now south-eastern Turkey.</span></li><li><span class="n">2</span><span><b>3rd millennium BC · Egypt · Mesopotamia. </b>Leavened, oven-baked bread becomes the staple food.</span></li><li><span class="n">3</span><span><b>123 BC–3rd c. · Rome. </b>The annona: the state hands out subsidised, later free, grain in the city of Rome.</span></li><li><span class="n cel">4</span><span><b>2nd c. AD · Aretaeus of Cappadocia. </b>Describes the “koiliakos”: the first known account of coeliac disease.</span></li><li><span class="n">5</span><span><b>11th–13th c. · Feudal Europe. </b>Lords force peasants to grind and bake, for a fee, in their mills and ovens.</span></li><li><span class="n">6</span><span><b>1870–1880 · Great Plains. </b>Hard winter wheat and roller mills make industrial white flour widespread.</span></li><li><span class="n cel">7</span><span><b>1888 · Samuel Gee. </b>Publishes “On the coeliac affection”, the first modern clinical description.</span></li><li><span class="n cel">8</span><span><b>1950 · Willem Dicke. </b>Shows that wheat causes the disease: coeliac children improved during the 1944 Dutch famine, when bread ran out.</span></li><li><span class="n">9</span><span><b>1960 · Green Revolution. </b>Borlaug’s semi-dwarf varieties multiply yields in Mexico, India and Pakistan.</span></li><li><span class="n">10</span><span><b>1980–2022 · Wheat. </b>World wheat production grows 83%, from 443 to 808 million tonnes.</span></li><li><span class="n cel">11</span><span><b>1994 · FACE founded. </b>The Federation of Coeliac Associations of Spain is created.</span></li><li><span class="n cel">12</span><span><b>2007 · First FACE figure. </b>FACE estimates €1,758 a year of extra cost per person. It stays above €1,450 until 2015.</span></li><li><span class="n cel">13</span><span><b>2009 · 20 mg/kg limit. </b>The EU sets the maximum gluten content for labelling a food “gluten-free” (Regulation EC 41/2009).</span></li><li><span class="n cel">14</span><span><b>2026 · Today. </b>€996.37 a year. The gap is smaller than in 2007, but the gluten-free basket costs 2.4 times the same with gluten; a baguette, 5.2 times.</span></li></ol>
    <p class="note">Since 1980, the thickness of the band is world wheat production <a class="ref" href="#src-WHEAT">[34]</a> <a class="ref" href="#src-FAO93">[35]</a>; before 1980 the band and milestones are figurative and not to scale. The height of the line above the band is FACE's extra cost <a class="ref" href="#src-F07">[20]</a> <a class="ref" href="#src-F26">[1]</a>, on the same euro scale along the whole line; there is no series between 1980 and 2007, and the dashed stretch only joins the starting point to the first figure. Years without production data (1981–1988, 1990 and 1993–1995) are interpolated, and from 2023 the band holds the last published value (2022). Legal limit for “gluten-free”: <a class="ref" href="#src-UE828">[39]</a>.</p>

    <p class="dek">From 2007 to 2023 the extra cost of GLUTEN-FREE food tended to fall, but several events have set that trend back. Either way it is unfair on people with coeliac disease, who receive no financial support in 15 of Spain's 19 regions.</p>
    <p class="dek small"><b>Average per period: <span id="avgA">€1,580</span></b> (2007–2015) and <b id="avgB">€950</b> (2016–2026)</p>

esc">No regional support. Teruel gives 100 to €250 per person depending on income (municipal support, not included).</div></div><div class="brow zero" role="listitem"><div class="bname">Valencia <a class="ref" href="#src-INFO">[31]</a></div><div class="btrack" aria-hidden="true"><i style="width: 0%;"></i></div><div class="bval"><b>€0</b><span class="sr-only"> per person per year, </span><span>0%</span></div><div class="bdesc">No current regional support. Some town councils, such as Vinaròs, have their own (not included).</div></div><div class="brow zero" role="listitem"><div class="bname">Canary Islands <a class="ref" href="#src-AEAT">[29]</a></div><div class="btrack" aria-hidden="true"><i style="width: 0%;"></i></div><div class="bval"><b>€0</b><span class="sr-only"> per person per year, </span><span>0%</span></div><div class="bdesc">No current support found.</div></div><div class="brow zero" role="listitem"><div class="bname">Cantabria <a class="ref" href="#src-AEAT">[29]</a></div><div class="btrack" aria-hidden="true"><i style="width: 0%;"></i></div><div class="bval"><b>€0</b><span class="sr-only"> per person per year, </span><span>0%</span></div><div class="bdesc">No current support found.</div></div><div class="brow zero" role="listitem"><div class="bname">Castile and León <a class="ref" href="#src-AEAT">[29]</a></div><div class="btrack" aria-hidden="true"><i style="width: 0%;"></i></div><div class="bval"><b>€0</b><span class="sr-only"> per person per year, </span><span>0%</span></div><div class="bdesc">No current support found.</div></div><div class="brow zero" role="listitem"><div class="bname">Catalonia <a class="ref" href="#src-CAT">[30]</a> <a class="ref" href="#src-INFO">[31]</a></div><div class="btrack" aria-hidden="true"><i style="width: 0%;"></i></div><div class="bval"><b>€0</b><span class="sr-only"> per person per year, </span><span>0%</span></div><div class="bdesc">Law 11/2026: the Generalitat must approve a support scheme before 31 December 2026; if it is not in place, a deduction of €250 per diagnosed person will apply. No support is available today.</div></div><div class="brow zero" role="listitem"><div class="bname">Ceuta <a class="ref" href="#src-CEU">[32]</a></div><div class="btrack" aria-hidden="true"><i style="width: 0%;"></i></div><div class="bval"><b>€0</b><span class="sr-only"> per person per year, </span><span>0%</span></div><div class="bdesc">Has offered 200 to €500 per family on an irregular basis (2018, 2021, 2024). No call found in 2026.</div></div><div class="brow zero" role="listitem"><div class="bname">Extremadura <a class="ref" href="#src-TEL">[24]</a></div><div class="btrack" aria-hidden="true"><i style="width: 0%;"></i></div><div class="bval"><b>€0</b><span class="sr-only"> per person per year, </span><span>0%</span></div><div class="bdesc">No cash support. Gluten-free food packs worth about €50 through the coeliac association, publicly funded (not included).</div></div><div class="brow zero" role="listitem"><div class="bname">Galicia <a class="ref" href="#src-INFO">[31]</a></div><div class="btrack" aria-hidden="true"><i style="width: 0%;"></i></div><div class="bval"><b>€0</b><span class="sr-only"> per person per year, </span><span>0%</span></div><div class="bdesc">No regional support. Barbadás town council gave up to €400 in 2025 (not included).</div></div><div class="brow zero" role="listitem"><div class="bname">Balearic Islands <a class="ref" href="#src-AEAT">[29]</a></div><div class="btrack" aria-hidden="true"><i style="width: 0%;"></i></div><div class="bval"><b>€0</b><span class="sr-only"> per person per year, </span><span>0%</span></div><div class="bdesc">No current support found.</div></div><div class="brow zero" role="listitem"><div class="bname">Madrid <a class="ref" href="#src-AEAT">[29]</a></div><div class="btrack" aria-hidden="true"><i style="width: 0%;"></i></div><div class="bval"><b>€0</b><span class="sr-only"> per person per year, </span><span>0%</span></div><div class="bdesc">No current support found.</div></div><div class="brow zero" role="listitem"><div class="bname">Melilla <a class="ref" href="#src-MEL">[33]</a></div><div class="btrack" aria-hidden="true"><i style="width: 0%;"></i></div><div class="bval"><b>€0</b><span class="sr-only"> per person per year, </span><span>0%</span></div><div class="bdesc">There were calls in the past; in 2026 only an agreement with the coeliac association.</div></div><div class="brow zero" role="listitem"><div class="bname">Navarre <a class="ref" href="#src-AEAT">[29]</a></div><div class="btrack" aria-hidden="true"><i style="width: 0%;"></i></div><div class="bval"><b>€0</b><span class="sr-only"> per person per year, </span><span>0%</span></div><div class="bdesc">There was support years ago; none current found.</div></div><div class="brow zero" role="listitem"><div class="bname">Basque Country <a class="ref" href="#src-AEAT">[29]</a></div><div class="btrack" aria-hidden="true"><i style="width: 0%;"></i></div><div class="bval"><b>€0</b><span class="sr-only"> per person per year, </span><span>0%</span></div><div class="bdesc">No current support found.</div></div><div class="brow zero" role="listitem"><div class="bname">Murcia <a class="ref" href="#src-INFO">[31]</a></div><div class="btrack" aria-hidden="true"><i style="width: 0%;"></i></div><div class="bval"><b>€0</b><span class="sr-only"> per person per year, </span><span>0%</span></div><div class="bdesc">No confirmed regional support. Alhama de Murcia has a municipal budget line (not included).</div></div></div>
      <p class="note">Sorted by euros received. The full bar is the €996.37 annual extra cost; the coloured part is what the region pays.</p>
    </div>
    <p class="note">Base: €996.37/person/year <a class="ref" href="#src-F26">[1]</a>. Assumes full access to the support or deduction; Asturias: up to €100 and means-tested.<br>“No support included” refers to current cash support from each regional government; Catalonia has approved it for the end of 2026, not yet available.<br>Excludes municipal support, food packs and MUFACE. All regions have the same visual weight.<br>Castile-La Mancha: direct payment. La Rioja, Andalusia and Asturias: tax deductions.</p>
    <blockquote class="quote">FACE estimates that 450,000 to 500,000 people in Spain have coeliac disease and that about 3 in 4 do not know it. <a class="ref" href="#src-DEB">[37]</a> <a class="ref" href="#src-CON25">[38]</a> Primary-care records point the same way: in Aragon only 0.35% of the population has a recorded diagnosis, against the expected 1%. <a class="ref" href="#src-ARA">[43]</a></blockquote>
    <div class="money" aria-label="What is needed and what is given">
      <div class="mcol"><span class="mlab">What would be needed each year</span><b id="mNeed">€124.5M</b><span id="mNeedTxt">to cover the full extra cost for about 125,000 diagnosed people (1 in 4). If all 500,000 were diagnosed, it would be €498.2M.</span></div>
      <div class="mcol"><span class="mlab">Maximum support the regions give</span><b id="mGiven" class="">€5.4M</b><span id="mGivenTxt">if every diagnosed person in Castile-La Mancha, La Rioja, Andalusia and Asturias received the full support: 4.3% of what would be needed.</span></div>
      <div class="mcol mpie"><span class="mlab">Share of what would be needed</span><div id="mPie"><svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="Pie chart: the regions cover 4.3% of what would be needed."><circle cx="75" cy="75" r="73" fill="var(--track)"></circle><path d="M75,75 L75,2 A73,73 0 0 1 94.55008647732228,4.666550498861355 Z" fill="var(--cover)"></path><circle cx="75" cy="75" r="73" fill="none" stroke="var(--rule)" stroke-width="1"></circle></svg><b class="">4.3%</b><span>covered. Families pay the remaining 95.7%.</span></div></div>
    </div>
    <p class="note" id="moneyNote">Own calculation. Diagnosed people distributed by each region's population (INE 2025 census) <a class="ref" href="#src-INE">[41]</a>; support per person in each region; extra cost of €996.37 <a class="ref" href="#src-F26">[1]</a>. It is a theoretical maximum: Castile-La Mancha caps support at €1,000 per family and Asturias limits it to incomes below €35,000. For comparison, the national bill estimates a cost of about €60M a year with current diagnoses <a class="ref" href="#src-BOCG">[23]</a>. The share of people diagnosed is an estimate: if it were different, the calculation changes proportionally (with 1 in 3 diagnosed, about €166M would be needed).</p>
    <p class="note" id="aggNote">Weighted by population (INE 2025 census), these four regions hold 25% of Spain's inhabitants, and their support would cover at most 4.3% of the country's total extra cost. It is a theoretical ceiling, not what is actually paid. <a class="ref" href="#src-INE">[41]</a></p>

    <p class="lab">Method</p>
    <div><strong>How it is measured.</strong> Every year FACE compares 21 specific gluten-free products (bread, pasta, flour, biscuits…) with their gluten-containing versions in national hypermarket chains and estimates an adult's annual spending. Fruit, vegetables and meat do not count: they contain no gluten. Until 2015 the calculation assumed a 2,000–2,300 kcal diet; since 2016, 2,000–2,200 kcal, and the number of chains and the month prices are collected have also changed. The figures are therefore best compared as a trend rather than year by year.</div>
    <div><strong>How sources are cited.</strong> Wherever it exists, the original document is linked (FACE report or note, BOE, Tax Agency, INE, regional government). Where the original could not be found, the news item quoting FACE's exact figure is linked and the point appears hollow in the chart. Sources consulted in October and November 2026. Source titles are kept in their original language.</div>

<script>
